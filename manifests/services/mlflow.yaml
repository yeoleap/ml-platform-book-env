# MLflow tracking server, as in the book's appendix A: metadata in PostgreSQL,
# artifacts in the S3 bucket `mlflow-artifacts`. Clients read and write
# artifacts directly from S3, so they need the S3 endpoint and keys too.
apiVersion: v1
kind: Namespace
metadata:
  name: mlflow
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-store
  namespace: mlflow
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
  POSTGRES_PASSWORD: postgres123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-deployment
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: book-env/mlflow:3.0.0
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: mlflow-store
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio-service.kubeflow.svc.cluster.local:9000
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec mlflow server --host 0.0.0.0 --port 5000 \
                --backend-store-uri "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres-release-postgresql.postgres.svc.cluster.local:5432/postgres" \
                --default-artifact-root s3://mlflow-artifacts
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
