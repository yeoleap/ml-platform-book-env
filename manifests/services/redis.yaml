# Redis as the Feast online store. The Service name matches the book's Helm
# release (`redis-deployment-master` in namespace `redis`).
apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-deployment
  namespace: redis
stringData:
  redis-password: redis123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment-master
  namespace: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-deployment
                  key: redis-password
          command: ["/bin/sh", "-ec", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-deployment-master
  namespace: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
