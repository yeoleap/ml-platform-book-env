          parameterType: STRING
        prefix:
          defaultValue: ml-latest-small
          isOptional: true
          parameterType: STRING
        upload_file_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
  comp-put-to-s3-2:
    executorLabel: exec-put-to-s3-2
    inputDefinitions:
      artifacts:
        inputFile:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        bucket:
          defaultValue: datasets
          isOptional: true
          parameterType: STRING
        prefix:
          defaultValue: ml-latest-small
          isOptional: true
          parameterType: STRING
        upload_file_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
  comp-qa-movielens:
    executorLabel: exec-qa-movielens
    inputDefinitions:
      parameters:
        bucket:
          defaultValue: datasets
          isOptional: true
          parameterType: STRING
