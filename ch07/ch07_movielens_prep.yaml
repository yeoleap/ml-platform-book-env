components:
  comp-csv-to-parquet:
    executorLabel: exec-csv-to-parquet
    inputDefinitions:
      artifacts:
        inputFile:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        output_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
