            schemaVersion: 0.0.1
  comp-split-ratings:
    executorLabel: exec-split-ratings
    inputDefinitions:
      artifacts:
        input_parquet:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
